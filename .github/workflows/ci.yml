name: ci

# Lint + test gate (added 2026-08-07). There was NO CI — nothing stopped a
# broken change from reaching main. Runs on every push and PR. Fully offline:
# the whole suite mocks its data sources (no network, no keys, deterministic).

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: ["**"]

# a newer push to the same ref cancels the older in-flight run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core + test tools; suite is offline-mocked, no [kr] needed)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Lint (ruff — version-stable select in pyproject)
        run: ruff check src tests

      - name: Test (offline, deterministic)
        run: pytest -q -p no:cacheprovider
